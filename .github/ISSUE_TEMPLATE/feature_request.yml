name: Feature or biome idea
description: Suggest a biome, landform, cave or other improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like to see? Real-world places, other mods or pictures that show it are welcome.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where should it appear?
      description: Climate, height, terrain, how rare.
