# Orogeny configuration
#
# Every setting is listed here with its default. Change a value and restart the game.
# World generation settings only affect chunks generated after the change; existing terrain stays as it is.
# A newer Orogeny adds its new settings to the end of this file, with their defaults.

# ==== World ====

# World scale for new worlds made without the create-world screen, such as on a dedicated server (1 to 6).
# One block is 30 / scale metres: higher scales spread the same terrain over more blocks (taller mountains, longer
# rivers). 2 is a good balance. Only used when a world is first created; after that the world keeps its own scale,
# so changing this does nothing to an existing world. In singleplayer, pick the scale on the create-world screen.
world.scale=2

# ==== Performance and hardware ====

# Inference device: "cpu", "gpu", or "auto" (try GPU first then fall back to CPU).
# Ignored for the CPU build.
inference.device=gpu

# Offload inactive models from VRAM so only one model occupies the GPU at a time.
# Keeps peak VRAM to 1.5-2 GB. Set to false if you have ~2.5+ GB of free VRAM for
# slightly faster generation (avoids reloading sessions between pipeline stages).
inference.offload_models=true

# Build the tiles around the one you are in ahead of time, while the inference thread would otherwise sit idle,
# so walking or flying into new terrain doesn't stall chunk loading. Tiles you need always come first.
performance.prefetch_tiles=true

# Terrain generation region side length in blocks. Must be a power of 2.
# Examples: 128, 256, 512, 1024.
# Use larger values to generate in larger batches (more chunks per second)
# Use smaller values to generate in smaller batches (most responsive)
tile_size=256

# Validate SHA-256 for pre-existing files in .minecraft/terrain-diffusion-models.
# Set to false to allow custom user-provided models/config without hash checks.
validate_model=true

# ==== Tools ====

# Port for the local terrain explorer web UI (started with /orogeny-explore command).
explorer.port=19801

# Spawn search: coarse-pixel region sizes for land detection near (0,0).
# Starts at initial_size x initial_size, expands by 8 each iteration up to max_size x max_size.
spawn_search.initial_size=16
spawn_search.max_size=128

# ==== Rivers and lakes ====

# Rivers and lakes (hydrology).
# Tune the thresholds with the Rivers view in /orogeny-explore, then copy the numbers here.
rivers.enabled=true
# Debug: set to false to carve rivers but not fill them with water.
rivers.place_water=true
# Hydrology region size and border, in native pixels (30 m each). Border must stay above 88.
rivers.region_size=256
rivers.margin=96
# Upstream area (in native pixels) needed before a channel becomes a stream / river / main river.
# Higher numbers mean fewer, bigger channels.
rivers.stream_threshold=2400
rivers.river_threshold=9000
rivers.main_threshold=25000
# No rivers or lakes above this terrain height (real-world metres).
rivers.max_water_m=6000
# A filled basin becomes a lake if it covers at least this many pixels and is this many metres deep.
rivers.lake_min_area=150
rivers.lake_min_depth=2
# Lakes in snowy biomes (where it snows and snow lies on the ground) freeze over: one layer of ice on top, liquid
# water under it. Lakes in other biomes stay open, however cold.
rivers.freeze_snowy_lakes=true
# Lake ice that generated in a biome where water doesn't freeze (from worlds made before 1.0.5) melts back into
# water while players are nearby. Ice placed by players never melts this way.
rivers.melt_natural_ice=true
# Freeze the top of all rivers and lakes high up. Off by default.
rivers.freeze=false
# With rivers.freeze on: water freezes above this terrain height (real-world metres). 0 = in snowy biomes instead.
rivers.freeze_height_m=3500

# ==== Oceans and coasts ====

# Tectonic sea-floor features and oceanic islands: ridges, trenches, island arcs, hotspot chains, atolls, reefs.
oceans.features=true
# The AI model draws the big oceanic islands itself (true), instead of cones being stamped onto its terrain (false).
oceans.model_islands=true
# The AI model draws the islands of archipelago seas itself (true), instead of the finished terrain being drowned.
oceans.model_archipelagos=true
# How strongly continents break up into archipelagos: shallow seas scattered with islands.
# 0 = off (the model's own coastlines only), 1 = default, up to 2 for island-heavy worlds.
oceans.archipelago_strength=1
# Young rift seas (narrow, Red Sea style).
oceans.rift_seas=true
# Active continental margins: a coastal mountain range, a narrow shelf and an ocean trench.
oceans.active_margins=true
# Orogeny's iceberg fields, ice islands, arctic ice shelves and sea ice (vanilla's icebergs are off).
oceans.icebergs=true
# Share of shipwrecks, ocean ruins and ocean monuments kept (0 to 1). Orogeny's oceans are far bigger than vanilla's,
# so vanilla spacing would fill them with wrecks; the default keeps about a third.
oceans.structure_frequency=0.35

# ==== Climate and biomes ====

# Ocean currents on west-facing coasts (west = -X), as on Earth: cold, dry coastal deserts on warm coasts
# (Atacama, Namib) and milder, wetter shores where the sea would otherwise freeze (Norway, British Columbia).
climate.coastal_currents=true
# Size multiplier for the patch biomes (meadow, dark forest, birch forest, cherry grove ...). 1 = the original sizes.
biomes.size=2.5

# ==== Landforms ====

# Volcanoes, shield volcanoes and lava fields.
landforms.volcanoes=true
# Valley glaciers and ice caps on cold mountains.
landforms.glaciers=true
# Canyons, badlands mesas, hoodoos, desert dunes, alluvial fans and karst towers.
landforms.arid=true
# Geothermal basins, Yellowstone, Yosemite valleys, waterfalls and mirage isles.
landforms.showpieces=true

# ==== Caves ====

# Orogeny's own noise caves (caverns and tunnels under any terrain, including inside high mountains).
caves.enabled=true
# Cave biomes: regions about 250 blocks across and 64 tall underground (stone, lush, fungal, deep dark and many more).
caves.biomes=true
# Water caves (underground lakes, glowworm grottos, karst caves) with river sinks and cenotes.
caves.water=true
# Sea caves in coastal cliffs, and caves opening onto the sea floor in places.
caves.sea=true
# Natural cave formations: columns, stalactites and stalagmites, boxwork and crystal rooms; flowstone, rimstone pools,
# cave waterfalls, travertine terraces, natural bridges, collapse domes and rock shelters with talus; with caves.sea,
# sea arches and coastal overhangs (wave-cut notches) on sea cliffs.
caves.formations=true

# ==== Structures and gameplay ====

# Level ground pads under village houses and outposts, so nothing floats or sinks into hills.
structures.terrain_pads=true
# Boats under water (still or flowing) float back up to the surface.
gameplay.floating_boats=true

# ==== Debug and advanced tuning ====
# These are for development; the defaults are what the mod is tuned for.

# Log once a minute where world generation time goes (send these lines with performance reports).
debug.timing=false
# How model-drawn archipelagos are made: "step", "keep" or "clear".
oceans.archipelago_mode=keep
# Share of the way the refined archipelago terrain is pulled back to the drowned terrain (0 to 1).
oceans.archipelago_final_pull=1
# How much of the model's coastline detail archipelago islands keep (0 to 2).
oceans.archipelago_detail=0.4
# Extra push toward the drowned archipelago terrain inside the model's stages (0 = off).
oceans.archipelago_steer_in=0
oceans.archipelago_steer_out=0
oceans.archipelago_steer_island=0
